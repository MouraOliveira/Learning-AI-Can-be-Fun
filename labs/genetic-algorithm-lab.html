<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Genetic Algorithm Lab</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#dcdcd5;--a:#2a6fdb;--b:#e07b00;--ok:#1a8f5a;--bad:#d03b3b;--b1:#1c1c1a;--b1t:#fff;--b0:#eceae3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#201f1d;--tx:#ecebe6;--mut:#a09e96;--bd:#3a3935;--a:#6aa3ff;--b:#ffa94d;--ok:#4cc790;--bad:#ff7a7a;--b1:#ecebe6;--b1t:#151514;--b0:#2d2c29}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:0 0 .3em}
p{margin:.4em 0}.mut{color:var(--mut);font-size:.92rem}
nav{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
nav button{white-space:nowrap}
button,select{font:inherit;padding:6px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);cursor:pointer}
button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button.pri{background:var(--a);border-color:var(--a);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.bits{display:inline-flex;gap:3px}
.bit{width:32px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font:600 1.1rem ui-monospace,Menlo,monospace;background:var(--b0);border:2px solid transparent;user-select:none}
.bit.b1{background:var(--b1);color:var(--b1t)}
.bit.ca{border-color:var(--a)}.bit.cb{border-color:var(--b)}
.bit.cut{margin-left:8px;box-shadow:-6px 0 0 -3px var(--bad)}
.bit.mut{border-color:var(--bad);outline:2px solid var(--bad)}
.bit.click{cursor:pointer}
.w{display:inline-flex;gap:3px;font:.7rem ui-monospace,monospace;color:var(--mut)}.w span{width:32px;text-align:center}
.lab{display:inline-block;min-width:78px;font-weight:600}
.A{color:var(--a)}.B{color:var(--b)}
table{border-collapse:collapse;width:100%;font-size:.92rem}td,th{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left}
.tw{overflow-x:auto}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;position:relative;border:1px solid var(--bd)}
.bar div{display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#fff;border-right:1px solid var(--card)}
.pin{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad)}
.hist{display:flex;align-items:flex-end;gap:6px;height:90px}
.hist div{flex:1;text-align:center;font-size:.72rem}.hist i{display:block;background:var(--a);border-radius:4px 4px 0 0;position:relative}
.hist i s{position:absolute;left:-2px;right:-2px;border-top:2px dashed var(--bad)}
input[type=range]{vertical-align:middle;width:150px}
.note{border-left:4px solid var(--a);padding:6px 10px;background:var(--b0);border-radius:0 8px 8px 0;margin:8px 0;font-size:.93rem}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main>
<h1>🧬 Genetic Algorithm Lab</h1>
<p class="mut">Explore the core GA operators on 8-bit binary chromosomes. Click bits, press buttons, and watch what happens.</p>
<div class="row"><label>Fitness function:
<select id="fsel"><option value="sq">f(x) = x² (decode as integer)</option><option value="ones">OneMax (count of 1s)</option></select></label></div>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const L=8, $=s=>document.querySelector(s);
const names=['1 · Encoding','2 · Selection','3 · Crossover','4 · Mutation','5 · Full GA'];
let ftype='sq', tab=0;
const val=b=>parseInt(b.join(''),2), ones=b=>b.reduce((s,x)=>s+x,0);
const fit=b=>ftype==='sq'?val(b)**2:ones(b);
const rb=()=>Array.from({length:L},()=>Math.random()<.5?1:0);
const ri=n=>Math.floor(Math.random()*n);
const fmt=n=>n.toLocaleString('en-US');
function bits(b,o={}){return '<span class="bits">'+b.map((x,i)=>`<span class="bit b${x} ${o.cls&&o.cls[i]||''} ${o.click?'click':''}" ${o.click?`data-i="${i}"`:''}>${x}</span>`).join('')+'</span>'}
function weights(){return '<span class="w">'+[128,64,32,16,8,4,2,1].map(w=>`<span>${w}</span>`).join('')+'</span>'}

/* state */
let enc=[0,1,0,1,1,0,1,1];
let pop=Array.from({length:6},rb), selRes=null;
let p1=rb(), p2=rb(), cx={m:'one',c1:3,c2:6,mask:rb()};
let mu={b:rb(),after:null,flips:[],pm:.125};
let ga={pop:[],gen:0,best:[],avg:[],timer:null,pm:.02,pc:.8,n:12,sel:'tour',elite:true};

$('#fsel').onchange=e=>{ftype=e.target.value;ga.pop=[];ga.best=[];ga.avg=[];ga.gen=0;stop();render()};
$('#nav').innerHTML=names.map((n,i)=>`<button data-t="${i}">${n}</button>`).join('');
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t!==undefined){stop();tab=+t;render()}};

function render(){
 document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',i===tab));
 [rEnc,rSel,rCx,rMu,rGA][tab]();
}

/* 1 Encoding */
function rEnc(){
 $('#view').innerHTML=`<div class="card"><h2>Binary encoding</h2>
 <p>A GA stores each candidate solution as a <b>chromosome</b>: a string of <b>genes</b> (bits). Here 8 bits encode an integer from 0 to 255. Click a bit to flip it.</p>
 <div>${bits(enc,{click:1})}</div><div>${weights()}</div>
 <div class="row"><span><b>Decoded x</b> = <span id="d"></span></span><span><b>Fitness</b> = <span id="f"></span></span></div>
 <div class="note" id="ex"></div>
 <button id="r">Random chromosome</button> <button id="z">All zeros</button> <button id="o">All ones</button></div>
 <div class="card"><h2>Why encoding matters</h2><p class="mut">The GA never sees x directly. It only manipulates bits and asks the fitness function “how good is this?”. Notice how flipping the leftmost bit changes x a lot (±128) while the rightmost changes it by just 1. This idea returns in the mutation tab.</p></div>`;
 const upd=()=>{ $('#d').textContent=val(enc);$('#f').textContent=fmt(fit(enc));
  const on=enc.map((x,i)=>x?[128,64,32,16,8,4,2,1][i]:null).filter(x=>x);
  $('#ex').textContent=(on.length?on.join(' + '):'0')+' = '+val(enc)+(ftype==='sq'?`, so f = ${val(enc)}² = ${fmt(fit(enc))}`:`; OneMax counts ${ones(enc)} ones`);
  document.querySelector('.bits').outerHTML=bits(enc,{click:1}); wire()};
 const wire=()=>document.querySelectorAll('.bit.click').forEach(el=>el.onclick=()=>{enc[+el.dataset.i]^=1;upd()});
 $('#r').onclick=()=>{enc=rb();upd()};$('#z').onclick=()=>{enc=enc.map(()=>0);upd()};$('#o').onclick=()=>{enc=enc.map(()=>1);upd()};
 upd();
}

/* 2 Selection */
const pal=['#2a6fdb','#e07b00','#1a8f5a','#a24bd0','#d03b3b','#0f9aa8'];
function rSel(){
 const f=pop.map(fit), tot=f.reduce((a,b)=>a+b,0)||1;
 $('#view').innerHTML=`<div class="card"><h2>Selection: who gets to reproduce?</h2>
 <p>Fitter individuals should be chosen more often, but weak ones keep a chance. Two classic methods:</p>
 <div class="row"><select id="sm"><option value="rw">Roulette wheel (fitness-proportionate)</option><option value="tour">Tournament</option></select>
 <label id="kl" style="display:none">k = <select id="k"><option>2</option><option>3</option><option>4</option></select></label>
 <button id="np">New population</button></div>
 <div class="tw"><table><tr><th>#</th><th>Chromosome</th><th>x</th><th>Fitness</th><th>Share</th></tr>
 ${pop.map((b,i)=>`<tr><td style="color:${pal[i]};font-weight:700">${i+1}</td><td>${bits(b)}</td><td>${val(b)}</td><td>${fmt(f[i])}</td><td>${(100*f[i]/tot).toFixed(1)}%</td></tr>`).join('')}</table></div>
 <p class="mut" style="margin-top:10px">Roulette wheel, laid flat: each slice is as wide as the individual's share of total fitness.</p>
 <div class="bar" id="wheel">${pop.map((b,i)=>`<div style="width:${100*f[i]/tot}%;background:${pal[i]}">${f[i]/tot>.05?i+1:''}</div>`).join('')}</div>
 <div class="row"><button class="pri" id="d1">Select one parent</button><button id="d100">Select 100 parents</button></div>
 <div class="note" id="msg">Press a button to draw parents.</div>
 <div class="hist" id="hist"></div></div>
 <div class="card"><h2>Compare</h2><p class="mut"><b>Roulette:</b> probability = fitness ÷ total fitness. A very fit individual can dominate (premature convergence). <b>Tournament:</b> pick k random individuals, the best wins. Larger k means more selection pressure, and it only needs rankings, not raw fitness values. The dashed red lines in the histogram mark the roulette expectation.</p></div>`;
 $('#sm').value=selRes?.m||'rw';
 const sync=()=>$('#kl').style.display=$('#sm').value==='tour'?'':'none';
 $('#sm').onchange=()=>{sync();$('#hist').innerHTML='';$('#msg').textContent='Press a button to draw parents.';$('.pin')?.remove()};sync();
 $('#np').onclick=()=>{pop=Array.from({length:6},rb);rSel()};
 const pick=()=>{ if($('#sm').value==='rw'){const r=Math.random()*tot;let s=0;for(let i=0;i<6;i++){s+=f[i];if(r<s)return{i,r:r/tot}}return{i:5,r:1}}
  const k=+$('#k').value,c=[];while(c.length<k){const j=ri(6);if(!c.includes(j))c.push(j)}
  return{i:c.reduce((a,b)=>f[b]>f[a]?b:a),c}};
 $('#d1').onclick=()=>{ $('.pin')?.remove();const p=pick();
  if(p.r!==undefined){const pn=document.createElement('div');pn.className='pin';pn.style.left=(p.r*100)+'%';$('#wheel').appendChild(pn);$('#msg').textContent=`The pointer landed at ${(p.r*100).toFixed(1)}% of the wheel, so individual ${p.i+1} is selected.`}
  else $('#msg').textContent=`Tournament between individuals ${p.c.map(x=>x+1).join(', ')}: the fittest (${p.i+1}) wins.`};
 $('#d100').onclick=()=>{ $('.pin')?.remove();const cnt=Array(6).fill(0);for(let n=0;n<100;n++)cnt[pick().i]++;
  const mx=Math.max(...cnt,...f.map(x=>100*x/tot),1);
  $('#hist').innerHTML=cnt.map((c,i)=>`<div><i style="height:${70*c/mx}px;background:${pal[i]}"><s style="bottom:${70*(100*f[i]/tot)/mx}px"></s></i>#${i+1}<br>${c}</div>`).join('');
  $('#msg').textContent='Counts from 100 independent selections. Fitter individuals are picked more often, but not always.'};
 selRes={m:$('#sm').value};
}

/* 3 Crossover */
function kids(){
 const {m,c1,c2,mask}=cx,A=p1,B=p2,src1=[],src2=[];
 for(let i=0;i<L;i++){let sw=m==='one'?i>=c1:m==='two'?(i>=c1&&i<c2):mask[i]===1;
  src1.push(sw?'b':'a');src2.push(sw?'a':'b')}
 const mk=s=>s.map((x,i)=>x==='a'?A[i]:B[i]);
 return{c:[mk(src1),mk(src2)],s:[src1,src2]}}
function rCx(){
 if(cx.c2<=cx.c1)cx.c2=Math.min(L-1,cx.c1+1);
 const k=kids(), cuts=(cx.m==='one'?[cx.c1]:cx.m==='two'?[cx.c1,cx.c2]:[]);
 const cl=a=>a.map((_,i)=>cuts.includes(i)?'cut':'');
 const col=(s,c)=>s.map((x,i)=>'c'+x+' '+c[i]);
 $('#view').innerHTML=`<div class="card"><h2>Crossover: combining two parents</h2>
 <p>Offspring inherit genes from both parents. Blue outlines come from Parent A, orange from Parent B. Red marks show cut points.</p>
 <div class="row"><select id="cm"><option value="one">One-point</option><option value="two">Two-point</option><option value="uni">Uniform</option></select>
 <button id="rp">Random parents</button><button id="rm" style="display:none">New mask</button></div>
 <div class="row" id="s1"><label>Cut point 1: <input type="range" id="c1" min="1" max="${L-1}" value="${cx.c1}"> <b>${cx.c1}</b></label></div>
 <div class="row" id="s2"><label>Cut point 2: <input type="range" id="c2" min="2" max="${L-1}" value="${cx.c2}"> <b>${cx.c2}</b></label></div>
 <div class="row"><span class="lab A">Parent A</span>${bits(p1,{cls:p1.map((_,i)=>'ca '+cl(p1)[i])})}<span class="mut">x=${val(p1)}, f=${fmt(fit(p1))}</span></div>
 <div class="row"><span class="lab B">Parent B</span>${bits(p2,{cls:p2.map((_,i)=>'cb '+cl(p2)[i])})}<span class="mut">x=${val(p2)}, f=${fmt(fit(p2))}</span></div>
 ${cx.m==='uni'?`<div class="row"><span class="lab">Mask</span>${bits(cx.mask)}<span class="mut">1 = swap this gene</span></div>`:''}
 <div class="row"><span class="lab">Child 1</span>${bits(k.c[0],{cls:col(k.s[0],cl(p1))})}<span class="mut">x=${val(k.c[0])}, f=${fmt(fit(k.c[0]))}</span></div>
 <div class="row"><span class="lab">Child 2</span>${bits(k.c[1],{cls:col(k.s[1],cl(p1))})}<span class="mut">x=${val(k.c[1])}, f=${fmt(fit(k.c[1]))}</span></div>
 <div class="note" id="cn"></div></div>
 <div class="card"><h2>Things to try</h2><p class="mut">Set one-point crossover with the cut near the left edge, then near the right. Which genes (high-value or low-value) get mixed? Notice that if both parents have the same bit at a position, no operator can change it: crossover only recombines existing genetic material.</p></div>`;
 $('#cm').value=cx.m;
 $('#cn').textContent={one:'One-point: pick a cut; child 1 = A before the cut + B after it, child 2 is the reverse.',two:'Two-point: the segment between the cuts is swapped between parents.',uni:'Uniform: every gene is swapped independently according to a random coin-flip mask.'}[cx.m];
 $('#s1').style.display=cx.m==='uni'?'none':'';$('#s2').style.display=cx.m==='two'?'':'none';$('#rm').style.display=cx.m==='uni'?'':'none';
 $('#cm').onchange=e=>{cx.m=e.target.value;rCx()};
 $('#c1').oninput=e=>{cx.c1=+e.target.value;rCx()};
 const c2=$('#c2');c2.oninput=e=>{cx.c2=+e.target.value;if(cx.c2<=cx.c1)cx.c1=cx.c2-1;rCx()};
 $('#rp').onclick=()=>{p1=rb();p2=rb();rCx()};$('#rm').onclick=()=>{cx.mask=rb();rCx()};
}

/* 4 Mutation */
function rMu(){
 const a=mu.after, cls=a?mu.flips.map(f=>f?'mut':''):[];
 $('#view').innerHTML=`<div class="card"><h2>Mutation: random bit flips</h2>
 <p>Each gene flips with a small probability p<sub>m</sub>. Mutation injects new genetic material that crossover alone could never create.</p>
 <div class="row"><label>p<sub>m</sub> = <b id="pv">${mu.pm.toFixed(3)}</b> <input type="range" id="pm" min="0" max="0.5" step="0.005" value="${mu.pm}"></label></div>
 <p class="mut">Expected flips per chromosome: L × p<sub>m</sub> = ${(L*mu.pm).toFixed(2)}</p>
 <div class="row"><span class="lab">Before</span>${bits(mu.b)}<span class="mut">x=${val(mu.b)}, f=${fmt(fit(mu.b))}</span></div>
 <div class="row"><span class="lab">After</span>${a?bits(a,{cls}):'<span class="mut">press “Mutate”</span>'}${a?`<span class="mut">x=${val(a)}, f=${fmt(fit(a))}</span>`:''}</div>
 <div class="row"><button class="pri" id="mm">Mutate</button><button id="mr">New chromosome</button><button id="m1k">Run 1000 trials</button></div>
 <div class="note" id="mn">Flipped genes get a red outline.</div></div>
 <div class="card"><h2>Think about it</h2><p class="mut">Set p<sub>m</sub> to 0: nothing ever changes. Set it near 0.5: the offspring is essentially random, so the search turns into random guessing. Typical values are about 1/L (here ≈ 0.125) or lower. Also compare how much x changes when a high-order versus a low-order bit flips.</p></div>`;
 $('#pm').oninput=e=>{mu.pm=+e.target.value;mu.after=null;rMu()};
 $('#mm').onclick=()=>{mu.flips=mu.b.map(()=>Math.random()<mu.pm);mu.after=mu.b.map((x,i)=>mu.flips[i]?1-x:x);rMu();
  const n=mu.flips.filter(Boolean).length;$('#mn').textContent=n?`${n} gene(s) flipped. Fitness ${fit(mu.after)>fit(mu.b)?'improved':fit(mu.after)<fit(mu.b)?'got worse':'stayed the same'}.`:'No gene flipped this time. Try again!'};
 $('#mr').onclick=()=>{mu.b=rb();mu.after=null;rMu()};
 $('#m1k').onclick=()=>{let t=0,up=0,dn=0;for(let n=0;n<1000;n++){const f=mu.b.map(()=>Math.random()<mu.pm);t+=f.filter(Boolean).length;const c=mu.b.map((x,i)=>f[i]?1-x:x);const d=fit(c)-fit(mu.b);if(d>0)up++;else if(d<0)dn++}
  $('#mn').textContent=`Over 1000 trials: average ${(t/1000).toFixed(2)} flips (expected ${(L*mu.pm).toFixed(2)}). Fitness improved ${up/10}%, worsened ${dn/10}%, unchanged ${(1000-up-dn)/10}%.`};
}

/* 5 Full GA */
function stop(){if(ga.timer){clearInterval(ga.timer);ga.timer=null}}
function init(){ga.pop=Array.from({length:ga.n},rb);ga.gen=0;ga.best=[];ga.avg=[];rec()}
function rec(){const f=ga.pop.map(fit);ga.best.push(Math.max(...f));ga.avg.push(f.reduce((a,b)=>a+b,0)/f.length)}
function selOne(f){ if(ga.sel==='rw'){const t=f.reduce((a,b)=>a+b,0);if(!t)return ri(f.length);let r=Math.random()*t,s=0;for(let i=0;i<f.length;i++){s+=f[i];if(r<s)return i}return f.length-1}
 const a=ri(f.length),b=ri(f.length);return f[a]>=f[b]?a:b}
function step(){ const f=ga.pop.map(fit),nx=[];
 if(ga.elite){nx.push(ga.pop[f.indexOf(Math.max(...f))].slice())}
 while(nx.length<ga.n){let a=ga.pop[selOne(f)].slice(),b=ga.pop[selOne(f)].slice();
  if(Math.random()<ga.pc){const c=1+ri(L-1);const a2=a.slice(0,c).concat(b.slice(c)),b2=b.slice(0,c).concat(a.slice(c));a=a2;b=b2}
  [a,b].forEach(c=>{if(nx.length<ga.n)nx.push(c.map(x=>Math.random()<ga.pm?1-x:x))})}
 ga.pop=nx;ga.gen++;rec()}
function rGA(){
 if(!ga.pop.length)init();
 $('#view').innerHTML=`<div class="card"><h2>Putting it together</h2>
 <p>Each generation: <b>select</b> parents → <b>crossover</b> (one-point, probability p<sub>c</sub>) → <b>mutate</b> → replace the population. Goal: maximize the fitness function chosen above.</p>
 <div class="row">
 <label>Population <select id="gn"><option>6</option><option>12</option><option>20</option></select></label>
 <label>Selection <select id="gs"><option value="tour">Tournament (k=2)</option><option value="rw">Roulette</option></select></label>
 <label><input type="checkbox" id="ge"> Elitism</label></div>
 <div class="row"><label>p<sub>c</sub> <input type="range" id="gc" min="0" max="1" step="0.05" value="${ga.pc}"> <b id="gcv">${ga.pc}</b></label>
 <label>p<sub>m</sub> <input type="range" id="gm" min="0" max="0.3" step="0.005" value="${ga.pm}"> <b id="gmv">${ga.pm}</b></label></div>
 <div class="row"><button class="pri" id="st">Step</button><button id="r10">Run 20 generations</button><button id="rs">Reset</button><b>Generation ${ga.gen}</b></div>
 <div id="ch"></div>
 <div class="tw"><table><tr><th>#</th><th>Chromosome</th><th>x</th><th>Fitness</th></tr>
 ${ga.pop.map((b,i)=>({b,f:fit(b)})).sort((x,y)=>y.f-x.f).map((o,i)=>`<tr><td>${i+1}</td><td>${bits(o.b)}</td><td>${val(o.b)}</td><td>${fmt(o.f)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Experiments</h2><p class="mut">1) Set p<sub>m</sub> = 0 and p<sub>c</sub> = 0: does anything improve beyond the luck of the initial population? 2) Switch elitism off and watch the best fitness dip. 3) Use a tiny population and rerun several times: how variable is the outcome?</p></div>`;
 $('#gn').value=ga.n;$('#gs').value=ga.sel;$('#ge').checked=ga.elite;
 $('#gn').onchange=e=>{ga.n=+e.target.value;init();rGA()};
 $('#gs').onchange=e=>ga.sel=e.target.value;$('#ge').onchange=e=>ga.elite=e.target.checked;
 $('#gc').oninput=e=>{ga.pc=+e.target.value;$('#gcv').textContent=ga.pc};
 $('#gm').oninput=e=>{ga.pm=+e.target.value;$('#gmv').textContent=ga.pm};
 $('#st').onclick=()=>{step();rGA()};$('#rs').onclick=()=>{stop();init();rGA()};
 $('#r10').onclick=()=>{stop();let n=0;ga.timer=setInterval(()=>{step();rGA();if(++n>=20)stop()},180)};
 chart();
}
function chart(){
 const W=600,H=200,P=36,mx=Math.max(...ga.best,1),n=Math.max(ga.best.length-1,1);
 const pts=a=>a.map((v,i)=>`${P+(W-P-8)*i/n},${H-P+4-(H-P-10)*v/mx}`).join(' ');
 $('#ch').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Best and average fitness per generation">
 <line x1="${P}" y1="${H-P+4}" x2="${W-8}" y2="${H-P+4}" stroke="var(--bd)"/><line x1="${P}" y1="6" x2="${P}" y2="${H-P+4}" stroke="var(--bd)"/>
 <text x="${P-4}" y="14" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(mx)}</text><text x="${P-4}" y="${H-P+4}" text-anchor="end" font-size="10" fill="var(--mut)">0</text>
 <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">generation</text>
 <polyline points="${pts(ga.avg)}" fill="none" stroke="var(--b)" stroke-width="2"/><polyline points="${pts(ga.best)}" fill="none" stroke="var(--a)" stroke-width="2.5"/>
 <text x="${W-12}" y="20" text-anchor="end" font-size="11" fill="var(--a)">best</text><text x="${W-12}" y="34" text-anchor="end" font-size="11" fill="var(--b)">average</text></svg>`}

render();
