<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab title</title>
<!--
  LIACbF lab checklist
  1. Keep it to ONE self-contained file: inline CSS and JavaScript, no build step.
  2. Follow the light/dark system setting (see the variables below).
  3. Save it in labs/ and add an entry to assets/labs.js.
  4. Keep the two script tags before </body>: they add the Home / Prev / Next button.
-->
<style>
:root{--bg:#f4f5f1;--card:#fff;--ink:#15222a;--mute:#475861;--line:#d6dcd7;--a:#17728f;--b:#d9622b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1417;--card:#162126;--ink:#e7f0ee;--mute:#a3b4b7;--line:#2a393e;--a:#5cc3e8;--b:#ff8f57;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 72px}
h1{font:700 clamp(1.8rem,4vw,2.4rem)/1.1 Georgia,serif;margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 18px;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-weight:700;margin:8px 0 4px}
input[type=range]{width:100%;accent-color:var(--a)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Lab title</h1>
  <p class="sub">One or two sentences saying what the student can explore here.</p>
  <div class="card">
    <label for="x">Parameter x = <output id="xv">1.0</output></label>
    <input id="x" type="range" min="0" max="2" step="0.1" value="1">
    <p>Result: <b id="out"></b></p>
  </div>
</div>
<script>
const x = document.getElementById('x'), xv = document.getElementById('xv'), out = document.getElementById('out');
function update(){ xv.textContent = (+x.value).toFixed(1); out.textContent = (+x.value * 2).toFixed(2); }
x.addEventListener('input', update); update();
</script>
<script src="../assets/labs.js"></script>
<script src="../assets/lab-nav.js"></script>
</body>
</html>
